# Publishes this plugin to npm when a version tag is pushed.
#
# Authentication is npm Trusted Publishing (OIDC): no long-lived token is
# stored in this repository. Configure the trusted publisher once on npmjs.com
# for this package — repository `Weihong-Liu/dsh-html-live-preview`, workflow
# file `release.yml` — then tagging is the whole release procedure.
#
# See RELEASING.md, including the alternative NPM_TOKEN setup.
name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs verify the package (version, syntax, tarball contents) without
  # publishing anything.
  workflow_dispatch:

permissions:
  contents: write # gh release create
  id-token: write # OIDC token for npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Install a publish-capable npm
        run: npm install --global npm@latest

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "releasing $version"

      - name: Syntax check
        run: npm run check

      - name: Show what would be packed
        run: npm pack --dry-run

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public

      - name: Open a GitHub release for the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
